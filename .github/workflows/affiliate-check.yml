name: Weekly affiliate link check

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_AMAZON_AFFILIATE_TAG: ${{ secrets.NEXT_PUBLIC_AMAZON_AFFILIATE_TAG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Check affiliate links
        id: check
        run: npx tsx src/scripts/checkAffiliateLinks.ts
        continue-on-error: true
      - name: Create issue if dead links found
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Dead affiliate links - ' + new Date().toISOString().split('T')[0],
              body: 'Check the workflow run logs for which ASINs failed, or run `npm run affiliate:check` via github.dev.',
              labels: ['affiliate', 'automated']
            })
